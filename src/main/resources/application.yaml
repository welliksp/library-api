spring:
  application:
    name: library-api
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "biblioteca:"
      use-key-prefix: true
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mongodb:
    authentication-database: library_db
    host: localhost
    port: 27017
    database: library_db
    username: library_user
    password: library_pass
modelmapper:
  matching-strategy: standard
  field-matching-enabled: true
  field-access-level: private
  skip-null-enabled: true
  ambiguity-ignored: true
  prefer-nested-properties: false
  deep-copy-enabled: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
    display-request-duration: true
    filter: true
    show-extensions: true
    show-common-extensions: true
    disable-swagger-default-url: true
    use-root-path: false
  cache:
    disabled: true
  show-actuator: false
  auto-tag-classes: true
  override-with-generic-response: false
logging:
  level:
    org.springframework.cache: DEBUG
    org.springframework.data.redis: DEBUG
